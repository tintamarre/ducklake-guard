[project]
name = "ducklake-guard"
version = "0.1.0"
description = "Access control for DuckLake lakehouses"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "Floyd Berndsen", email = "hi@berndsen.io"}]
keywords = ["ducklake", "access-control", "s3", "hetzner", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1.0",
    "duckdb>=1.5.0",
    "minio>=7.2.0",
    "psycopg[binary]>=3.1.0",
]

[project.scripts]
dga = "ducklake_guard.cli:cli"

[project.urls]
Homepage = "https://github.com/berndsen-io/ducklake-guard"
Repository = "https://github.com/berndsen-io/ducklake-guard"
Documentation = "https://github.com/berndsen-io/ducklake-guard/tree/main/docs"
Issues = "https://github.com/berndsen-io/ducklake-guard/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducklake_guard"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S608"]
"scripts/**/*.py" = ["S608"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["ducklake_guard"]

[tool.pytest.ini_options]
markers = ["e2e: hetzner infrastructure tests"]
